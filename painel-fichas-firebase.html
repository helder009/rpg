<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPG: Sítio SS — Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=Vollkorn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{--papel:#e6d9b8;--papel-esc:#d8c69c;--tinta:#211a12;--tinta-suave:#4a3d2c;--brasa:#9e2b16;--brasa-esc:#6e1d0f;--mata:#42542f;--ocre:#b5842f;--linha:rgba(33,26,18,.28)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--tinta);font-family:"Vollkorn",Georgia,serif;font-size:16px;line-height:1.5;
    background:var(--papel);background-image:repeating-linear-gradient(0deg,rgba(120,90,50,.03) 0 2px,transparent 2px 4px)}
  .wrap{max-width:1040px;margin:0 auto;padding:18px}
  h1{font-family:"Rye",serif;font-weight:400;font-size:clamp(1.5rem,5vw,2.4rem);margin:0;line-height:1}
  h3{font-family:"Rye",serif;font-weight:400;font-size:1.15rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .eyebrow{font-family:"Special Elite",monospace;text-transform:uppercase;letter-spacing:.24em;font-size:.66rem;color:var(--brasa-esc)}
  header.top{border:3px solid var(--tinta);background:var(--papel-esc);padding:14px 16px;box-shadow:6px 6px 0 var(--tinta);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .modo{font-family:"Special Elite",monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;padding:4px 10px;border:2px solid var(--tinta)}
  .modo.jogador{background:var(--papel);color:var(--tinta-suave)}
  .modo.mestre{background:var(--brasa);color:var(--papel);border-color:var(--brasa-esc)}
  .barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  button{font-family:"Special Elite",monospace;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:2px solid var(--tinta);background:var(--papel-esc);color:var(--tinta);padding:7px 12px;box-shadow:2px 2px 0 var(--tinta)}
  button:hover{filter:brightness(1.03)}button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--tinta)}
  button.brasa{background:var(--brasa);color:var(--papel);border-color:var(--brasa-esc)}
  button.mini{padding:3px 8px;font-size:.72rem;box-shadow:1px 1px 0 var(--tinta)}
  button.menu-btn{padding:9px 16px;font-size:.82rem}
  select{font-family:inherit;font-size:.95rem;border:2px solid var(--tinta);background:#fff;color:var(--tinta);padding:6px 8px}
  .sync{font-family:"Special Elite",monospace;font-size:.7rem;color:var(--tinta-suave);margin-left:auto}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b5842f;margin-right:5px;vertical-align:middle}
  .dot.on{background:#4a7a2e}.dot.off{background:#9e2b16}
  .aviso{border:2px dashed var(--brasa);background:rgba(158,43,22,.07);padding:10px 14px;font-size:.88rem;margin-bottom:12px}
  .aviso b{color:var(--brasa-esc)}
  .layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  @media (max-width:840px){.layout{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:14px}
  .sel-wrap label{display:block;font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brasa-esc);margin-bottom:3px}
  .sel-wrap select{width:100%;font-size:1.02rem;font-weight:700}
  .card{border:2.5px solid var(--tinta);background:var(--papel-esc);box-shadow:5px 5px 0 var(--tinta);border-left-width:8px;margin-top:12px}
  .card .cab{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;border-bottom:2px solid var(--tinta)}
  .card .nome{font-family:"Rye",serif;font-size:1.35rem;line-height:.9}
  .card .cl{font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brasa)}
  .card .corpo{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .hp{display:flex;align-items:center;gap:8px;justify-content:center}
  .hp .valor{font-family:"Rye",serif;font-size:2rem;line-height:1;color:var(--brasa)}
  .hp .valor small{font-size:1rem;color:var(--tinta-suave)}
  .barra-hp{height:10px;border:2px solid var(--tinta);background:var(--papel);overflow:hidden}
  .barra-hp i{display:block;height:100%;transition:width .2s,background .2s}
  .hpbtns{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
  .duo{display:flex;gap:8px}.campo{flex:1}
  .campo label{display:block;font-family:"Special Elite",monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tinta-suave);margin-bottom:2px}
  .campo label.lbl-forte{color:var(--brasa);font-weight:700;font-size:.66rem}
  .vitais-topo{display:flex;gap:8px;align-items:stretch;margin-bottom:2px}
  .vbox{border:2px solid var(--tinta);background:var(--papel);text-align:center;padding:5px 12px;display:flex;flex-direction:column;justify-content:center;min-width:74px}
  .vbox b{font-family:"Special Elite",monospace;font-size:.56rem;letter-spacing:.1em;color:var(--tinta-suave);text-transform:uppercase}
  .vbox .vv{font-family:"Rye",serif;font-size:1.35rem;line-height:1.05;color:var(--brasa)}
  .vbox.ca .vv{color:var(--tinta)}
  .vcond{flex:1;display:flex;flex-direction:column;gap:2px}
  .vcond .lbl-forte{display:block;font-family:"Special Elite",monospace;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;font-weight:700;color:var(--brasa);margin-bottom:2px}
  .vcond input,.vcond .txt{font-size:.85rem}
  .painel.notas-box{background:#a2c0d2}
  .img-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .img-slot{display:flex;flex-direction:column;gap:6px}
  .img-box{height:240px;border:2px solid var(--tinta);background:#f3ead0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .img-box img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;cursor:zoom-in}
  .img-box .img-ph{font-family:"Special Elite",monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-suave)}
  .img-box.erro::after{content:"imagem não carregou";font-family:"Special Elite",monospace;font-size:.66rem;color:var(--brasa-esc);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(158,43,22,.08)}
  .img-ctrl{display:flex;gap:6px}
  .img-ctrl input{flex:1;font-size:.82rem}
  .img-ctrl button{padding:4px 9px;box-shadow:1px 1px 0 var(--tinta)}
  .inim-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card.inim{margin-top:0;border-left-color:#9e2b16}
  .card.inim .cab{gap:8px}
  .card.inim .cab input.nome-in{flex:1;font-family:"Rye",serif;font-size:1.08rem;border:none;background:transparent;padding:2px 0;color:var(--tinta);box-shadow:none}
  .card.inim .cab input.nome-in:focus{outline:1px solid var(--brasa)}
  .card.inim .cab button{padding:2px 8px;box-shadow:none}
  .card.inim .attr input{width:100%}
  .critb{display:inline-block;background:#2f7d3a;color:#fff;font-family:"Special Elite",monospace;font-size:.55rem;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;margin-left:4px}
  .resultado .big.crit{color:#2f7d3a}
  .crit-flag{font-family:"Special Elite",monospace;font-size:.72rem;color:#2f7d3a;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
  .npc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .ie-card{border:2px solid var(--tinta);background:rgba(158,43,22,.06);padding:10px;display:flex;flex-direction:column;gap:6px}
  .ie-cab{display:flex;gap:6px;align-items:center}
  .ie-nome{flex:1;font-weight:700;font-family:"Rye",serif;font-size:1.05rem;border:2px solid var(--tinta);background:var(--papel);padding:3px 6px}
  .ie-hp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .ie-pv{font-family:"Rye",serif;font-size:1.35rem;color:var(--brasa);margin-right:4px}
  .ie-pv small{font-size:.68rem;color:var(--tinta-suave)}
  .ie-bar{height:8px;border:2px solid var(--tinta);background:var(--papel);overflow:hidden}
  .ie-bar i{display:block;height:100%}
  .ie-row{display:flex;align-items:center;gap:6px}
  .ie-row label{font-family:"Special Elite",monospace;font-size:.58rem;text-transform:uppercase;color:var(--tinta-suave)}
  .ie-row input{width:52px}
  .ie-attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
  .ie-attr{text-align:center;border:1px solid var(--linha);padding:2px 0}
  .ie-attr b{display:block;font-family:"Special Elite",monospace;font-size:.5rem;color:var(--brasa-esc)}
  .ie-attr input{width:100%;text-align:center;padding:1px 0;font-size:.8rem;border:1px solid var(--tinta);background:var(--papel);box-shadow:none}
  .ie-attr .m{display:block;font-size:.56rem;color:var(--tinta-suave)}
  .ie-lbl{display:block;font-family:"Special Elite",monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--brasa);font-weight:700;margin-top:2px}
  .ie-card textarea{min-height:46px;font-size:.85rem}
  .vitais-top{display:flex;gap:8px;align-items:stretch;margin-bottom:2px}
  .vt{border:2px solid var(--tinta);background:rgba(255,255,255,.16);padding:5px 6px;text-align:center;min-width:66px;display:flex;flex-direction:column;justify-content:center}
  .vt b{font-family:"Special Elite",monospace;font-size:.58rem;letter-spacing:.1em;color:var(--tinta-suave)}
  .vt .vt-n{font-family:"Rye",serif;font-size:1.25rem;line-height:1.15}
  .vt.pv .vt-n{color:var(--brasa)}
  .vt .vt-in{width:42px;font-family:inherit;font-size:.9rem;text-align:center;padding:1px 0;border:1px solid var(--tinta);background:var(--papel);box-shadow:none;vertical-align:middle}
  .vt-cond{flex:1;display:flex;flex-direction:column;justify-content:center}
  .vt-cond label{display:block;font-family:"Special Elite",monospace;text-transform:uppercase;letter-spacing:.1em;font-size:.62rem;font-weight:700;color:var(--brasa);margin-bottom:3px}
  .vt-cond .txt{font-size:.9rem}
  .campo .ro{font-weight:700}.campo .txt{font-size:.9rem;line-height:1.45}
  input,textarea{width:100%;font-family:inherit;font-size:.92rem;border:2px solid var(--tinta);background:var(--papel);color:var(--tinta);padding:5px 7px}
  input[type=number]{text-align:center}
  textarea{resize:vertical;min-height:38px}
  input:disabled,textarea:disabled{background:transparent;border-color:var(--linha);color:var(--tinta);cursor:default;opacity:1}
  .num-inline{width:52px}
  .attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;border-top:2px dashed var(--linha);padding-top:10px}
  .attr{text-align:center;border:1px solid var(--linha);padding:4px 2px;background:rgba(255,255,255,.14)}
  .attr b{display:block;font-family:"Special Elite",monospace;font-size:.55rem;color:var(--brasa-esc)}
  .attr .n{font-weight:700;font-size:.95rem}.attr .m{font-size:.66rem;color:var(--tinta-suave)}
  .attr input{width:100%;padding:2px 0;font-size:.9rem;text-align:center;border:1px solid var(--tinta);background:var(--papel);box-shadow:none}
  .assin{border-top:1px dashed var(--linha);padding-top:6px}
  .assin .tag{display:inline-block;background:var(--brasa);color:var(--papel);font-family:"Special Elite",monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;margin-bottom:3px}
  .assin b{font-family:"Rye",serif;font-weight:400;font-size:1rem}
  .painel{border:2.5px solid var(--tinta);background:var(--papel-esc);box-shadow:5px 5px 0 var(--tinta);padding:12px 14px}
  .painel.dados-box{background:#918b7c}
  .tagm{font-family:"Special Elite",monospace;font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;background:var(--brasa);color:var(--papel);padding:2px 7px}
  .adv-row{display:flex;gap:6px;margin-bottom:8px}
  .pill{font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;padding:5px 9px;border:2px solid var(--tinta);cursor:pointer;background:var(--papel)}
  .pill.on{background:var(--brasa);color:var(--papel);border-color:var(--brasa-esc)}
  .dados-puros{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .die{font-family:"Rye",serif;font-size:1rem;padding:8px 14px}
  .modman{font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;color:var(--tinta);display:flex;align-items:center;gap:4px;margin-left:auto}
  .modman input{width:46px}
  .linha-roll{display:flex;gap:8px;margin:7px 0}.linha-roll select{flex:1}
  .dano-opts{display:flex;gap:14px;align-items:center;margin:2px 0 2px;font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta)}
  .dano-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
  .dano-opts input[type=checkbox]{width:16px;height:16px;box-shadow:none;padding:0;margin:0;accent-color:var(--brasa)}
  .resultado{border:2px solid var(--tinta);background:#fff;text-align:center;padding:10px;margin:8px 0}
  .resultado .big{font-family:"Rye",serif;font-size:2.6rem;line-height:1;color:var(--brasa)}
  .resultado .det{font-family:"Special Elite",monospace;font-size:.72rem;color:var(--tinta-suave);margin-top:4px}
  .log{max-height:150px;overflow:auto;border-top:2px dashed rgba(33,26,18,.4);padding-top:6px}
  .log div{font-size:.82rem;padding:2px 0;border-bottom:1px solid rgba(33,26,18,.25)}
  .log .t{font-family:"Special Elite",monospace;color:var(--brasa-esc);font-weight:700}
  #notasMestre{width:100%;min-height:120px;font-family:inherit;font-size:.98rem;line-height:1.5;border:2px solid var(--tinta);background:var(--papel);color:var(--tinta);padding:8px 10px;resize:vertical}
  #notasMestre:disabled{background:transparent;opacity:1;cursor:default}
  .canvas-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  .canvas-ctrl label{font-family:"Special Elite",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta-suave)}
  .swatch{width:26px;height:26px;border:2px solid var(--tinta);padding:0;cursor:pointer;box-shadow:none}
  .canvas-wrap{border:2px solid var(--tinta);background:#f3ead0;line-height:0}
  #tela{width:100%;height:auto;display:block;touch-action:none}
  #canvasNota{font-size:.8rem;color:var(--tinta-suave);margin-top:5px}
  .flash{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);font-family:"Special Elite",monospace;font-size:.74rem;padding:8px 16px;box-shadow:3px 3px 0 var(--brasa);opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
  .flash.on{opacity:1}
  .lightbox{position:fixed;inset:0;background:rgba(20,15,10,.93);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:96vw;max-height:96vh;width:auto;height:auto;object-fit:contain;box-shadow:0 0 0 3px var(--tinta),6px 6px 0 rgba(0,0,0,.5)}
  .lightbox .fechar{position:absolute;top:14px;right:16px;background:var(--brasa);color:var(--papel);border:2px solid var(--papel);box-shadow:none;font-size:.9rem;padding:4px 11px;cursor:pointer;z-index:2}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div><div class="eyebrow">Painel · Firebase · tempo real</div><h1>RPG: Sítio SS</h1></div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <button id="btnMestre" class="brasa">🔑 Entrar como Mestre</button>
      <span id="modoBadge" class="modo jogador">Modo Jogador</span>
    </div>
  </header>

  <div id="avisoBox"></div>

  <div class="barra">
    <button class="menu-btn" onclick="window.open('guia-do-jogador.html','_blank')">📖 Guia do Jogador ↗</button>
    <button class="menu-btn" onclick="window.open('https://www.google.com/search?q=roll+a+d20','_blank')">🎲 D20 online ↗</button>
    <button id="btnPin" style="display:none" class="mini">Trocar PIN</button>
    <button id="btnReset" style="display:none" class="mini">Zerar fichas</button>
    <span id="sync" class="sync"><span class="dot"></span>iniciando…</span>
  </div>

  <div class="layout">
    <div class="col">
      <div class="sel-wrap"><label>Ficha visível</label><select id="selFicha"></select></div>
      <div id="ficha"></div>
    </div>
    <div class="col">
      <div class="painel dados-box">
        <h3>Dados</h3>
        <div class="linha-roll" id="roladorWrap" style="display:none">
          <label style="font-family:'Special Elite',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta);align-self:center;white-space:nowrap">Rolar como</label>
          <select id="selRolador"></select>
        </div>
        <div class="adv-row">
          <span class="pill on" id="pNorm" onclick="setAdv('none')">Normal</span>
          <span class="pill" id="pAdv" onclick="setAdv('adv')">Vantagem</span>
          <span class="pill" id="pDis" onclick="setAdv('dis')">Desvantagem</span>
        </div>
        <div class="dados-puros">
          <button class="die brasa" onclick="rolarPuro(20)">d20</button>
          <button class="die brasa" onclick="rolarPuro(6)">d6</button>
          <button class="die brasa" onclick="rolarPuro(4)">d4</button>
          <span class="modman">mod <input id="modMan" type="number" value="0"></span>
        </div>
        <div class="linha-roll"><select id="selTeste"></select><button onclick="rolarTeste()">Teste</button></div>
        <div class="linha-roll">
          <select id="selAtaque">
            <option value="FOR">Ataque corpo a corpo (FOR)</option>
            <option value="DES">Ataque à distância / fino (DES)</option>
            <option value="MAG">Ataque mágico</option>
          </select>
          <button onclick="rolarAtaque()">Ataque</button>
        </div>
        <div class="linha-roll">
          <select id="selDano">
            <option>1d4</option><option selected>1d6</option><option>1d8</option><option>1d10</option><option>1d12</option>
            <option>2d4</option><option>2d6</option><option>2d8</option><option>2d10</option><option>3d6</option>
          </select>
          <button onclick="rolarDano()">Dano</button>
        </div>
        <div class="dano-opts">
          <label><input type="checkbox" id="chkAttrDano" checked> + atributo</label>
          <label><input type="checkbox" id="chkCritDano"> crítico (×2 dados)</label>
        </div>
        <div class="resultado"><div class="big" id="resBig">—</div><div class="det" id="resDet">escolha um dado ou uma rolagem</div></div>
        <div id="rollTools" style="display:none;text-align:right;margin-bottom:4px"><button class="mini" onclick="limparRolls()">🗑 Limpar histórico</button></div>
        <div class="log" id="log"></div>
      </div>
      <div class="painel notas-box">
        <h3>Anotações do Mestre <span class="tagm">ao vivo</span></h3>
        <textarea id="notasMestre" placeholder="—" disabled></textarea>
      </div>
    </div>
  </div>

  <div class="painel" id="inimigosSec" style="display:none;margin-top:14px">
    <h3>Inimigos <span class="tagm">só o Mestre vê</span></h3>
    <div id="inimigos" class="inim-grid"></div>
    <button class="mini brasa" style="margin-top:10px" onclick="addInimigo()">+ Novo inimigo</button>
  </div>

  <div class="painel" style="margin-top:14px">
    <h3>Quadro do Mestre <span class="tagm">ao vivo</span></h3>
    <div id="canvasCtrl" class="canvas-ctrl" style="display:none">
      <label>Cor</label>
      <button class="swatch" style="background:#211a12" onclick="setCor('#211a12')"></button>
      <button class="swatch" style="background:#9e2b16" onclick="setCor('#9e2b16')"></button>
      <button class="swatch" style="background:#2f6b3a" onclick="setCor('#2f6b3a')"></button>
      <button class="swatch" style="background:#2b5a8c" onclick="setCor('#2b5a8c')"></button>
      <button class="swatch" style="background:#b5842f" onclick="setCor('#b5842f')"></button>
      <input type="color" id="corPicker" value="#211a12" onchange="setCor(this.value)" style="width:34px;height:28px;padding:0;border:2px solid var(--tinta);box-shadow:none;cursor:pointer">
      <label>Traço</label>
      <input type="range" id="brush" min="1" max="22" value="3" style="width:90px">
      <button class="mini" id="btnBorracha" onclick="toggleBorracha()">Borracha</button>

        <button class="mini" onclick="ajustaInimHP('${e.id}',1)">+1</button>
        <button class="mini" onclick="ajustaInimHP('${e.id}',5)">+5</button>
        <button class="mini brasa" onclick="ajustaInimHP('${e.id}',999)">cheio</button>
      </div>
      <div class="duo">
        <div class="campo"><label>PV máx</label><input class="ilive num-inline" type="number" value="${e.pvMax}" data-id="${e.id}" data-f="pvMax"></div>
        <div class="campo"><label>CA</label><input class="ilive num-inline" type="number" value="${e.ca}" data-id="${e.id}" data-f="ca"></div>
      </div>
      <div class="attrs">${attrsHTML}</div>
      <div class="campo"><label class="lbl-forte">Ataques</label><textarea class="ilive" data-id="${e.id}" data-f="ataques" style="min-height:58px">${esc(e.ataques)}</textarea></div>
      <div class="campo"><label class="lbl-forte">Traços</label><textarea class="ilive" data-id="${e.id}" data-f="tracos" style="min-height:58px">${esc(e.tracos)}</textarea></div>
    </div>
  </div>`;
}
function renderInimigos(){
  const cont=$("inimigos"); if(!cont)return;
  if(!gm){ cont.innerHTML=""; return; }
  cont.innerHTML=(state.inimigos||[]).map(enemyCardHTML).join("");
  cont.querySelectorAll(".ilive").forEach(el=>{
    const commit=()=>commitInim(el);
    el.addEventListener("change",()=>{ commit(); if(el.dataset.attr||el.dataset.f==="pvMax"||el.dataset.f==="ca") renderInimigos(); });
    el.addEventListener("blur",commit);
  });
}
function commitInim(el){
  const e=(state.inimigos||[]).find(x=>x.id===el.dataset.id); if(!e)return;
  if(el.dataset.attr){ let v=parseInt(el.value)||0; v=Math.max(1,Math.min(30,v)); e.attrs[el.dataset.attr]=v; saveRemote(); return; }
  const f=el.dataset.f;
  if(f==="pvMax"||f==="ca"){ let v=parseInt(el.value)||0; v=Math.max(0,v); e[f]=v; if(f==="pvMax")e.pvAtual=Math.min(e.pvAtual,v); }
  else e[f]=el.value;
  if(el.dataset.f==="nome") popularRolador();
  saveRemote();
}
function ajustaInimHP(id,delta){ const e=(state.inimigos||[]).find(x=>x.id===id); if(!e)return; e.pvAtual=Math.max(0,Math.min(e.pvMax,e.pvAtual+delta)); renderInimigos(); saveRemote(); }
function addInimigo(){
  const ord=(state.inimigos||[]).reduce((m,e)=>Math.max(m,e.ord||0),0)+1;
  const id="e"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
  state.inimigos.push({id,ord,nome:"Novo inimigo",ca:12,pvMax:10,pvAtual:10,cond:"",attrs:{FOR:10,DES:10,CON:10,INT:10,SAB:10,CAR:10},ataques:"",tracos:""});
  renderInimigos(); popularRolador(); saveRemote();
}
function removeInimigo(id){
  const e=(state.inimigos||[]).find(x=>x.id===id);
  if(!confirm("Remover "+(e?e.nome:"este inimigo")+"?"))return;
  state.inimigos=(state.inimigos||[]).filter(x=>x.id!==id);
  renderInimigos(); popularRolador(); saveRemote();
}

function setAdv(a){ adv=a; $("pNorm").classList.toggle("on",a==="none"); $("pAdv").classList.toggle("on",a==="adv"); $("pDis").classList.toggle("on",a==="dis"); }
function d(n){ return 1+Math.floor(Math.random()*n); }
function d20adv(){ if(adv==="adv"){const a=d(20),b=d(20);return{v:Math.max(a,b),rolls:[a,b]};} if(adv==="dis"){const a=d(20),b=d(20);return{v:Math.min(a,b),rolls:[a,b]};} const a=d(20); return{v:a,rolls:[a]}; }
function detTxt(r,m){ const s=m>=0?"+"+m:""+m; const base=r.rolls.length>1?"["+r.rolls.join(", ")+"]→"+r.v:"["+r.v+"]"; return base+(m!==0?" "+s:"")+" = "+(r.v+m); }
function mostra(label,r,m,quem){ const total=r.v+m, det=detTxt(r,m), crit=(r.v===20); const big=$("resBig"); big.textContent=total; big.classList.toggle("crit",crit); $("resDet").innerHTML=(quem?esc(quem)+" · ":"")+esc(label)+" · "+esc(det)+(crit?' <span class="crit-flag">★ Crítico!</span>':''); pushRoll({t:total,l:label,d:det,q:quem||"",ts:Date.now(),crit:crit}); }
let localRolls=[];
function entryHTML(e){ const hora=e.ts?new Date(e.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):""; const quem=e.q?`<b>${esc(e.q)}</b> · `:""; const crit=e.crit?' <span class="critb">Crítico!</span>':''; return `<div><span class="t">${e.t}</span> — ${quem}${esc(e.l)}: ${esc(e.d)}${crit} <span style="color:var(--tinta-suave)">· ${hora}</span></div>`; }
function renderLogArr(arr){ const L=$("log"); L.innerHTML=""; arr.slice(-50).reverse().forEach(e=>L.insertAdjacentHTML("beforeend", entryHTML(e))); }
function renderLogSnap(val){ if(!val){ $("log").innerHTML=""; return; } const arr=Object.keys(val).map(k=>val[k]).filter(Boolean).sort((a,b)=>(a.ts||0)-(b.ts||0)); renderLogArr(arr); }
function pushRoll(e){ if(online&&rollsRef){ rollsRef.push(e); } else { localRolls.push(e); if(localRolls.length>80)localRolls=localRolls.slice(-80); renderLogArr(localRolls); } }
function limparRolls(){ if(online&&rollsRef){ rollsRef.remove(); } else { localRolls=[]; renderLogArr([]); } }
function entidadeAtiva(){ if(!gm) return charAtual(); const s=$("selRolador"), v=s?s.value:""; if(v==="__mestre__") return {mestre:true,nome:"Mestre"}; let e=state.chars.find(c=>c.id===v); if(!e)e=(state.inimigos||[]).find(x=>x.id===v); return e||charAtual(); }
function popularRolador(){ const s=$("selRolador"); if(!s)return; const prev=s.value; let html=state.chars.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join(""); if(gm){ html+=`<option value="__mestre__">— Mestre (rolagem simples) —</option>`; if((state.inimigos||[]).length) html+=`<optgroup label="Inimigos">`+state.inimigos.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join("")+`</optgroup>`; } s.innerHTML=html; if(prev && Array.from(s.options).some(o=>o.value===prev)) s.value=prev; else s.value=atual; }
function rolarPuro(sides){ const m=parseInt($("modMan").value)||0; let r; if(sides===20){ r=d20adv(); } else { const a=d(sides); r={v:a,rolls:[a]}; } const advtxt=(sides===20&&adv!=="none")?(" ("+(adv==="adv"?"vantagem":"desvantagem")+")"):""; mostra("d"+sides+advtxt,r,m,entidadeAtiva().nome); }
function profDe(c,skill){ if(c.expert&&c.expert.indexOf(skill)>=0)return PROF*2; if(c.pericias&&c.pericias.indexOf(skill)>=0)return PROF; return 0; }
function popularTestes(){ const s=$("selTeste"), prev=s.value; let html=""; for(const k in ATRIBS) html+=`<option value="attr:${k}">Teste de ${ATRIBS[k]} (${k})</option>`; const c=entidadeAtiva(); Object.keys(SKILLS).forEach(sk=>{ const p=profDe(c,sk); const mk=p>=PROF*2?" ✦✦":p>=PROF?" ✦":""; html+=`<option value="skill:${sk}">${sk} (${SKILLS[sk]})${mk}</option>`; }); s.innerHTML=html; s.value=prev||"skill:Percepção"; if(!s.value)s.value="skill:Percepção"; }
function rolarTeste(){ const c=entidadeAtiva(), val=$("selTeste").value, parts=val.split(":"), tipo=parts[0], chave=parts[1]; let attr,prof=0,label; if(tipo==="attr"){ attr=chave; label="Teste de "+ATRIBS[attr]+" ("+attr+")"; } else { attr=SKILLS[chave]; prof=profDe(c,chave); label=chave+" ("+attr+")"; } const mo=(c.attrs?modN(c.attrs[attr]):0)+prof; const advtxt=adv!=="none"?(" ["+(adv==="adv"?"vant":"desv")+"]"):""; mostra(label+advtxt, d20adv(), mo, c.nome); }
function rolarAtaque(){ const c=entidadeAtiva(), tipo=$("selAtaque").value; let attr,nome; if(tipo==="FOR"){ attr="FOR"; nome="Ataque corpo a corpo"; } else if(tipo==="DES"){ attr="DES"; nome="Ataque à distância/fino"; } else { attr=c.conjura||["INT","SAB","CAR"].reduce((a,b)=>(c.attrs?modN(c.attrs[b]):0)>(c.attrs?modN(c.attrs[a]):0)?b:a,"INT"); nome="Ataque mágico ("+attr+")"; } const mo=(c.attrs?modN(c.attrs[attr])+PROF:0); const advtxt=adv!=="none"?(" ["+(adv==="adv"?"vant":"desv")+"]"):""; mostra(nome+advtxt, d20adv(), mo, c.nome); }
function mostraSimples(total,label,det,quem){ const big=$("resBig"); big.textContent=total; big.classList.remove("crit"); $("resDet").innerHTML=(quem?esc(quem)+" · ":"")+esc(label)+" · "+esc(det); pushRoll({t:total,l:label,d:det,q:quem||"",ts:Date.now(),crit:false}); }
function rolarDano(){
  const c=entidadeAtiva(), expr=$("selDano").value, mm=expr.match(/^(\d+)d(\d+)$/); if(!mm)return;
  let qtd=parseInt(mm[1]), faces=parseInt(mm[2]);
  const critX2=$("chkCritDano").checked; if(critX2)qtd*=2;
  const rolls=[]; let soma=0; for(let i=0;i<qtd;i++){ const x=d(faces); rolls.push(x); soma+=x; }
  const tipo=$("selAtaque").value, attr=tipo==="FOR"?"FOR":tipo==="DES"?"DES":(c.conjura||"CAR");
  const m=($("chkAttrDano").checked && c.attrs)?modN(c.attrs[attr]):0;
  const total=soma+m, sinal=m>0?" +"+m:(m<0?" "+m:"");
  const det="["+rolls.join(", ")+"]"+sinal+" = "+total;
  mostraSimples(total, "Dano "+qtd+"d"+faces+(critX2?" (crít ×2)":""), det, c.nome);
}

let notaTimer=null;
function syncNotasUI(){ const t=$("notasMestre"); if(!t)return; t.disabled=!gm; if(document.activeElement!==t)t.value=state.notasMestre||""; t.placeholder=gm?"O que os jogadores devem ver — o que está à vista, pistas, avisos…":"— sem anotações —"; }

let cor="#211a12", brush=3, borracha=false, desenhando=false, pts=[];
const tela=$("tela"), ctx=tela.getContext("2d"); ctx.lineCap="round"; ctx.lineJoin="round";
function setCor(c){ cor=c; borracha=false; const bb=$("btnBorracha"); if(bb)bb.classList.remove("brasa"); const cp=$("corPicker"); if(cp&&c.charAt(0)==="#")cp.value=c; }
function toggleBorracha(){ borracha=!borracha; $("btnBorracha").classList.toggle("brasa",borracha); }
function clearTela(){ ctx.clearRect(0,0,tela.width,tela.height); }
function limparTela(){ if(online&&db){ db.ref("salas/"+ROOM+"/quadro").remove(); } else { clearTela(); } }
function drawStroke(s){ if(!s||!s.p||s.p.length<4)return; ctx.save(); ctx.globalCompositeOperation=s.e?"destination-out":"source-over"; ctx.strokeStyle=s.c||"#211a12"; ctx.lineWidth=s.w||3; ctx.beginPath(); ctx.moveTo(s.p[0]*tela.width,s.p[1]*tela.height); for(let i=2;i<s.p.length;i+=2)ctx.lineTo(s.p[i]*tela.width,s.p[i+1]*tela.height); ctx.stroke(); ctx.restore(); }
function posNorm(ev){ const r=tela.getBoundingClientRect(); return [(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height]; }
function segLocal(){ const n=pts.length; if(n<4)return; ctx.save(); ctx.globalCompositeOperation=borracha?"destination-out":"source-over"; ctx.strokeStyle=cor; ctx.lineWidth=brush; ctx.beginPath(); ctx.moveTo(pts[n-4]*tela.width,pts[n-3]*tela.height); ctx.lineTo(pts[n-2]*tela.width,pts[n-1]*tela.height); ctx.stroke(); ctx.restore(); }
function fimTraco(){ if(!desenhando)return; desenhando=false; if(pts.length>=4&&online&&desenhoRef){ desenhoRef.push({c:cor,w:brush,e:borracha,p:pts.slice()}); } pts=[]; }
function attachCanvas(){
  tela.addEventListener("pointerdown",ev=>{ if(!gm)return; desenhando=true; pts=[]; const[x,y]=posNorm(ev); pts.push(x,y); try{tela.setPointerCapture(ev.pointerId);}catch(e){} });
  tela.addEventListener("pointermove",ev=>{ if(!desenhando)return; const[x,y]=posNorm(ev); pts.push(x,y); segLocal(); });
  tela.addEventListener("pointerup",fimTraco); tela.addEventListener("pointercancel",fimTraco);
  $("brush").addEventListener("input",e=>{ brush=parseInt(e.target.value)||3; });
}
function atualizaExtra(){ const cc=$("canvasCtrl"); if(cc)cc.style.display=gm?"flex":"none"; const cn=$("canvasNota"); if(cn)cn.textContent=gm?"Você desenha; os jogadores veem em tempo real.":"Somente o Mestre desenha; vocês veem em tempo real."; if(tela)tela.style.cursor=gm?"crosshair":"default"; const rt=$("rollTools"); if(rt)rt.style.display=gm?"block":"none"; const isec=$("inimigosSec"); if(isec)isec.style.display=gm?"block":"none"; const rw=$("roladorWrap"); if(rw)rw.style.display=gm?"flex":"none"; syncNotasUI(); }

$("btnMestre").addEventListener("click",()=>{ if(gm){ gm=false; setModo(); render(); flash("Modo jogador"); return; } const p=prompt("Digite o PIN do Mestre:"); if(p===null)return; if(p===state.pin){ gm=true; setModo(); render(); if(online)saveRemote(); flash("Modo Mestre ativado"); } else alert("PIN incorreto."); });
$("btnPin").addEventListener("click",async()=>{ const n=prompt("Novo PIN do Mestre:",state.pin); if(n&&n.trim()){ state.pin=n.trim(); await saveRemote(); flash("PIN atualizado"); } });
$("btnReset").addEventListener("click",async()=>{ if(!confirm("Zerar as fichas dos jogadores para o padrão? (inimigos, quadro e anotações do Mestre não mudam)"))return; const pin=state.pin,nm=state.notasMestre,inim=state.inimigos,imgs=state.imagens; state=JSON.parse(JSON.stringify(PADRAO)); state.pin=pin; state.notasMestre=nm; state.inimigos=inim; state.imagens=imgs; await saveRemote(); render(); flash("Fichas zeradas"); });
$("selFicha").addEventListener("change",e=>{ atual=e.target.value; renderFicha(); popularTestes(); });
$("selRolador").addEventListener("change",()=>popularTestes());
(function(){ const t=$("notasMestre"); t.addEventListener("input",()=>{ if(!gm)return; state.notasMestre=t.value; clearTimeout(notaTimer); notaTimer=setTimeout(saveRemote,500); }); t.addEventListener("blur",()=>{ if(!gm)return; state.notasMestre=t.value; saveRemote(); }); })();

(function init(){ const m=location.hash.match(/sala=([^&]+)/); if(m)ROOM=decodeURIComponent(m[1]); attachCanvas(); setModo(); render(); popularTestes(); atualizaExtra(); initFirebase(); })();
</script>
</body>
</html>
